<style>
        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }
        
        .loading-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, theme('colors.primary'), theme('colors.secondary'));
            border-radius: 9999px;
            animation: load 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            box-shadow: 0 0 10px theme('colors.primary');
        }

        @keyframes load {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        .glow-effect {
            animation: pulse-glow 2s infinite alternate;
        }
        
        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 10px rgba(175, 198, 255, 0.3)); }
            100% { filter: drop-shadow(0 0 25px rgba(175, 198, 255, 0.6)); }
        }
    </style>
</head>
<body class="bg-[#0F1115] text-on-background h-screen w-screen flex flex-col items-center justify-center m-0 overflow-hidden font-body-md antialiased">
<main class="flex flex-col items-center justify-center flex-1 w-full max-w-sm px-margin-mobile z-10">

</div>
<div class="flex flex-col items-center gap-md">
<div class="loading-bar">
<div class="loading-progress"></div>
</div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest opacity-80">
                Track. Improve. Transform.
            </p>
</div>
</main>
<script>
        // Simulated transition after loading
        setTimeout(() => {
            const body = document.querySelector('body');
            body.style.transition = 'opacity 0.5s ease';
            body.style.opacity = '0';
        }, 2200);
    </script>
</body></html>
