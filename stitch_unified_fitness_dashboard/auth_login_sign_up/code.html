<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>FitJourney - Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400&family=JetBrains+Mono:wght@500&family=Sora:wght@600;700&display=swap" rel="stylesheet">

                        "stat-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(26, 29, 36, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-glass {
            background: rgba(15, 17, 21, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            outline: none;
            border-bottom-color: #528dff;
            background: rgba(26, 29, 36, 0.9);
        }
        .btn-glow {
            background: linear-gradient(135deg, #528dff 0%, #00a572 100%);
            position: relative;
            z-index: 1;
        }
        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            filter: blur(15px);
            opacity: 0.5;
            z-index: -1;
            transition: opacity 0.3s ease;
        }
        .btn-glow:hover::before {
            opacity: 0.8;
        }
        .fade-transition {
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hidden-form {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transform: translateY(20px);
        }
        .active-form {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            transform: translateY(0);
        }
        .btn-loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden">
    <!-- Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-20%] left-[-10%] w-[70vw] h-[70vw] rounded-full bg-primary-container opacity-10 blur-[120px]"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary-container opacity-10 blur-[120px]"></div>
    </div>

    <!-- Main Container -->
    <div class="glass-panel rounded-xl w-full max-w-[480px] p-md md:p-lg relative z-10 shadow-2xl overflow-hidden relative">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-xl">
            <img alt="FitJourney Logo" class="w-24 h-24 mb-md object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDCt3zYSamWv7jK8XC_c1ENjJNCJ_kr4V6BcMBL5jKp7gS2VxYCVjGALxPq6msm91RjSArvkU2wxaCcoWpXo_2AQVWZTcnQWhHNP9y1Li9nmJtbbSXDELXdyI1MPJ0_hle-67DIVTRj1ZvKFqp5TQOD-UOQLjK7JX9BsRv-6RwZDsv7GO3VttW-WLNLtfObd25pHuKeQvb2sM3t77lqWOmSoiuRnurbiSosbbI0jsJdvz5qPPT7w6UKFA">
            <h1 class="font-display-lg text-headline-lg-mobile md:text-display-lg text-primary text-center">FitJourney</h1>
        </div>

        <!-- Login Form -->
        <div class="fade-transition active-form w-full" id="login-form">
            <h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg mb-sm text-center">Welcome Back</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mb-lg text-center">Resume your training protocol.</p>
            <form id="loginForm" class="flex flex-col gap-sm">
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
                    <input id="loginEmail" class="w-full input-glass rounded-lg pl-[40px] pr-sm py-[14px] text-on-surface font-body-md text-body-md" placeholder="Email Address" required type="email">
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
                    <input id="loginPassword" class="w-full input-glass rounded-lg pl-[40px] pr-sm py-[14px] text-on-surface font-body-md text-body-md" placeholder="Password" required type="password">
                </div>
                <div class="flex justify-end mt-xs">
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
                </div>
                <button id="loginBtn" class="btn-glow rounded-xl w-full py-[16px] text-surface font-headline-lg-mobile text-body-lg mt-md" type="submit">Login</button>
            </form>
            <div class="mt-lg text-center font-body-md text-body-md text-on-surface-variant border-t border-white/10 pt-md">
                Don't have an account? <button class="text-secondary hover:text-secondary-fixed transition-colors font-label-md text-label-md ml-xs" onclick="toggleForms()">Sign Up</button>
            </div>
        </div>

        <!-- Sign Up Form -->
        <div class="fade-transition hidden-form w-full" id="signup-form">
            <h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg mb-sm text-center">Start Your Journey</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mb-md text-center">Initialize your bio-metrics profile.</p>
            <div class="w-full h-2 bg-surface-container rounded-full mb-lg overflow-hidden">
                <div class="h-full bg-secondary w-1/3 rounded-full relative">
                    <div class="absolute inset-0 bg-white/30 blur-sm"></div>
                </div>
            </div>
            <form id="signupForm" class="flex flex-col gap-sm">
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
                    <input id="signupName" class="w-full input-glass rounded-lg pl-[40px] pr-sm py-[14px] text-on-surface font-body-md text-body-md" placeholder="Full Name" required type="text">
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
                    <input id="signupEmail" class="w-full input-glass rounded-lg pl-[40px] pr-sm py-[14px] text-on-surface font-body-md text-body-md" placeholder="Email Address" required type="email">
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
                    <input id="signupPassword" class="w-full input-glass rounded-lg pl-[40px] pr-sm py-[14px] text-on-surface font-body-md text-body-md" placeholder="Password" required type="password" minlength="6">
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">lock_reset</span>
                    <input id="signupConfirmPassword" class="w-full input-glass rounded-lg pl-[40px] pr-sm py-[14px] text-on-surface font-body-md text-body-md" placeholder="Confirm Password" required type="password" minlength="6">
                </div>
                <button id="signupBtn" class="btn-glow rounded-xl w-full py-[16px] text-surface font-headline-lg-mobile text-body-lg mt-md" type="submit">Create Account</button>
            </form>
            <div class="mt-lg text-center font-body-md text-body-md text-on-surface-variant border-t border-white/10 pt-md">
                Already have an account? <button class="text-primary hover:text-primary-container transition-colors font-label-md text-label-md ml-xs" onclick="toggleForms()">Login</button>
            </div>
        </div>

        <!-- Status Message -->
        <div id="statusMsg" class="hidden mt-4 p-3 rounded-lg text-center font-label-md text-sm"></div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============ SUPABASE CONFIG ============
        const SUPABASE_URL = 'https://qskirqcxyvrimwyiunxx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFza2lycWN4eXZyaW13eWl1bnh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODY4MjcsImV4cCI6MjEwMTc2MjgyN30.PeIJ1b5XnxUo7tpq88RXYl4QedsIzjx7CTiTaBqLjyk';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============ CHECK IF ALREADY LOGGED IN ============
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.href = '../home_dashboard/code.html';
            }
        });

        // ============ HELPER: SHOW STATUS ============
        function showStatus(msg, isError = false) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'mt-4 p-3 rounded-lg text-center font-label-md text-sm ' +
                (isError ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400');
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        // ============ TOGGLE FORMS ============
        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            
            if (loginForm.classList.contains('active-form')) {
                loginForm.classList.remove('active-form');
                loginForm.classList.add('hidden-form');
                setTimeout(() => {
                    signupForm.classList.remove('hidden-form');
                    signupForm.classList.add('active-form');
                }, 300);
            } else {
                signupForm.classList.remove('active-form');
                signupForm.classList.add('hidden-form');
                setTimeout(() => {
                    loginForm.classList.remove('hidden-form');
                    loginForm.classList.add('active-form');
                }, 300);
            }
        }

        // ============ LOGIN ============
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            
            btn.textContent = 'Logging in...';
            btn.classList.add('btn-loading');
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                showStatus(error.message, true);
                btn.textContent = 'Login';
                btn.classList.remove('btn-loading');
            } else {
                showStatus('Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = '../home_dashboard/code.html';
                }, 1000);
            }
        });

        // ============ SIGNUP ============
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const btn = document.getElementById('signupBtn');
            
            if (password !== confirmPassword) {
                showStatus('Passwords do not match!', true);
                return;
            }
            
            btn.textContent = 'Creating account...';
            btn.classList.add('btn-loading');
            
            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: {
                    data: { full_name: name }
                }
            });
            
            if (error) {
                showStatus(error.message, true);
                btn.textContent = 'Create Account';
                btn.classList.remove('btn-loading');
            } else {
                if (data.user && data.user.identities && data.user.identities.length === 0) {
                    showStatus('Account already exists! Please login.', true);
                    btn.textContent = 'Create Account';
                    btn.classList.remove('btn-loading');
                } else {
                    showStatus('Account created! Check your email to verify.');
                    setTimeout(() => toggleForms(), 2000);
                    btn.textContent = 'Create Account';
                    btn.classList.remove('btn-loading');
                }
            }
        });
    </script>
</body>
</html>
