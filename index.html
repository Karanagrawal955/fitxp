    *{margin:0;padding:0;box-sizing:border-box}
    html,body{overflow-x:hidden;width:100%}
    body{font-family:'Hanken Grotesk',sans-serif;background:var(--bg);color:var(--on-surface);min-height:100vh}
    .material-symbols-outlined{font-family:'Material Symbols Outlined';visibility:hidden}
    .icons-loaded .material-symbols-outlined{visibility:visible}
    #app{overflow:hidden;width:100%}
    .glass-card{background:linear-gradient(180deg,rgba(36,40,50,0.8),rgba(26,29,36,0.8));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);overflow:hidden}
    .glass-panel{background:rgba(26,29,36,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);overflow:hidden}
    .text-gradient{background:linear-gradient(90deg,#afc6ff,#4edea3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .btn-glow{background:linear-gradient(135deg,#528dff,#00a572);position:relative;z-index:1}
    .btn-glow::before{content:'';position:absolute;inset:0;background:inherit;filter:blur(15px);opacity:0.5;z-index:-1;transition:opacity 0.3s}
    .btn-glow:hover::before{opacity:0.8}
    .input-glass{background:rgba(15,17,21,0.8);border:1px solid rgba(255,255,255,0.05);border-bottom:2px solid transparent;transition:all 0.3s;color:var(--on-surface);font-family:'Hanken Grotesk',sans-serif;font-size:16px;padding:14px 12px 14px 40px;border-radius:0.5rem;width:100%}
    .input-glass:focus{outline:none;border-bottom-color:#528dff;background:rgba(26,29,36,0.9)}
    .input-glass::placeholder{color:var(--on-surface-variant)}
    .google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 24px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e1e2ed;font-family:'Sora',sans-serif;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.3s;backdrop-filter:blur(10px)}
    .google-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);transform:translateY(-1px)}
    .google-btn:active{transform:translateY(0)}
    .google-btn svg{width:24px;height:24px;flex-shrink:0}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn 0.2s}
    .modal-content{background:linear-gradient(180deg,#242832,#1A1D24);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:24px;width:100%;max-width:440px;animation:slideUp 0.3s}
    .splash-logo{animation:bounceIn 0.8s cubic-bezier(0.68,-0.55,0.27,1.55) forwards}
    .splash-bar{animation:loadBar 2s ease-in-out forwards}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes bounceIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
    @keyframes loadBar{0%{width:0%}100%{width:100%}}
    @keyframes progress{0%{stroke-dasharray:0 100}}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    @keyframes fadeIn{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes drawLine{to{stroke-dashoffset:0}}
    @media(min-width:768px){.md-nav{display:flex!important}.md-bottom{display:none!important}main{margin-left:240px!important;padding-left:24px!important;padding-right:48px!important}}
    @media(max-width:767px){.md-bottom{display:flex!important}.md-nav{display:none!important}}
  </style>
</head>

      var h = 0;
      for (var i = 0; i < p.length; i++) {
        h = ((h << 5) - h + p.charCodeAt(i)) | 0;

      return 'h_' + Math.abs(h).toString(36);

      handleSignIn: function() {
        var email = document.getElementById('siEmail').value.trim();
        var pass = document.getElementById('siPass').value;
        var errEl = document.getElementById('siError');
        errEl.style.display = 'none';
        if (!email || !pass) {
          errEl.textContent = 'Please fill in all fields.';
          errEl.style.display = 'block';
          return;
        }
        var users = getUsers();
        var found = null;
        for (var i = 0; i < users.length; i++) {
          if (users[i].email === email && users[i].password === hashPassword(pass)) {
            found = users[i];
            break;
          }
        }
        if (!found) {
          errEl.textContent = 'Invalid email or password.';
          errEl.style.display = 'block';
          return;
        }
        saveUser({ id: found.id, name: found.name, email: found.email, picture: null });
        var data = getData();
        data.profile.name = found.name.split(' ')[0];
        saveData(data);
        App.init();
      },

      handleSignUp: function() {
        var name = document.getElementById('suName').value.trim();
        var email = document.getElementById('suEmail').value.trim();
        var pass = document.getElementById('suPass').value;
        var pass2 = document.getElementById('suPass2').value;
        var errEl = document.getElementById('suError');
        errEl.style.display = 'none';
        if (!name || !email || !pass || !pass2) {
          errEl.textContent = 'Please fill in all fields.';
          errEl.style.display = 'block';
          return;
        }
        if (pass.length < 6) {
          errEl.textContent = 'Password must be at least 6 characters.';
          errEl.style.display = 'block';
          return;
        }
        if (pass !== pass2) {
          errEl.textContent = 'Passwords do not match.';
          errEl.style.display = 'block';
          return;
        }
        var users = getUsers();
        for (var i = 0; i < users.length; i++) {
          if (users[i].email === email) {
            errEl.textContent = 'An account with this email already exists.';
            errEl.style.display = 'block';
            return;
          }
        }
        var newUser = { id: 'u_' + Date.now(), name: name, email: email, password: hashPassword(pass) };
        users.push(newUser);
        saveUsers(users);
        saveUser({ id: newUser.id, name: newUser.name, email: newUser.email, picture: null });
        var data = getData();
        data.profile.name = name.split(' ')[0];
        saveData(data);
        App.init();
      },

      home: function(d) {
        var user = getUser();
        var today = todayStr();
        var todayWorkouts = d.workouts.filter(function(w) { return w.date === today; });
        var todayMeals = d.meals.filter(function(m) { return m.date === today; });
        var totalCals = 0;
        for (var i = 0; i < todayMeals.length; i++) { totalCals += todayMeals[i].calories; }
        var pct = Math.min(100, todayWorkouts.length * 33);
        var workoutCalories = 0;
        for (var k = 0; k < todayWorkouts.length; k++) { workoutCalories += todayWorkouts[k].calories; }
        var totalProtein = 0;
        for (var p = 0; p < todayMeals.length; p++) { totalProtein += todayMeals[p].protein; }
        var q = getDailyQuests(d);
        var questsDone = 0;
        for (var qi = 0; qi < q.quests.length; qi++) { if (q.quests[qi].done) questsDone++; }
        var questHtml = '';

      startPlanWorkout: function(dayIdx) {
        var lvlIdx = getLevelIndex(this.data.profile.xp);
        var weekPlan = getWeeklyPlan(lvlIdx + 1, this.data.profile.xp);
        var day = weekPlan[dayIdx];
        if (!day || day.type === 'rest') return;

        this._pendingWorkout = {
          dayName: day.name,
          exercises: day.exercises.map(function(e){ return e.name; }),
          type: day.type === 'hiit' ? 'cardio' : 'strength',
          exCount: day.exercises.length
        };

        this.startGymTimer(dayIdx);
        this.renderPage();
      },

      startGymTimer: function(dayIdx) {
        var lvlIdx = getLevelIndex(this.data.profile.xp);
        var gymMins = GYM_DURATION[lvlIdx + 1] || 45;
        var weekPlan = getWeeklyPlan(lvlIdx + 1, this.data.profile.xp);
        var day = weekPlan[dayIdx];
        var exCount = day ? day.exercises.length : 4;
        this.gymTimerTarget = Math.round(gymMins * (0.7 + exCount * 0.05)) * 60;
        this.gymTimerSeconds = 0;
        this.gymTimerRunning = true;
        this.stepGoal = this.gymTimerTarget * 2;
        var self = this;
        if (this.gymTimerInterval) clearInterval(this.gymTimerInterval);
        this.gymTimerInterval = setInterval(function() {
          if (!self.gymTimerRunning) return;
          self.gymTimerSeconds++;
          var el = document.getElementById('gymTimerLive');
          if (el) {
            var m = Math.floor(self.gymTimerSeconds / 60);
            var s = self.gymTimerSeconds % 60;
            el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
            var pct = Math.min(100, Math.round((self.gymTimerSeconds / self.gymTimerTarget) * 100));
            var bar = document.getElementById('gymTimerBar');
            if (bar) bar.style.width = pct + '%';
            var status = document.getElementById('gymTimerStatus');
            if (status) {
              if (pct >= 100) status.textContent = 'Time Complete!';
              else if (pct >= 75) status.textContent = 'Almost Done';
              else if (pct >= 50) status.textContent = 'Halfway';
              else status.textContent = 'Keep Going';
            }
          }
          if (self.gymTimerSeconds >= self.gymTimerTarget) {
            self.gymTimerRunning = false;
            self.stopMotionTracking();
            clearInterval(self.gymTimerInterval);
          }
        }, 1000);
        this.startMotionTracking();
      },

      stopGymTimer: function() {
        this.gymTimerRunning = false;
        this.stopMotionTracking();
        if (this.gymTimerInterval) clearInterval(this.gymTimerInterval);
      },

      startMotionTracking: function() {
        var self = this;
        this.stepCount = 0;
        this.caloriesBurned = 0;
        this.lastAccel = { x: 0, y: 0, z: 0 };
        this.motionTracking = true;

        if (window.DeviceMotionEvent) {
          if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(function(state) {
              if (state === 'granted') {
                window.addEventListener('devicemotion', self._motionHandler.bind(self));
              }
            }).catch(function() {});
          } else {
            window.addEventListener('devicemotion', self._motionHandler.bind(self));
          }
        }

        self._stepInterval = setInterval(function() {
          if (!self.motionTracking) return;
          self.caloriesBurned = Math.round(self.stepCount * 0.04);
          var stepEl = document.getElementById('stepCount');
          var calEl = document.getElementById('calCount');
          var stepBar = document.getElementById('stepBar');
          if (stepEl) stepEl.textContent = self.stepCount.toLocaleString();
          if (calEl) calEl.textContent = self.caloriesBurned;
          if (stepBar) {
            var pct = Math.min(100, Math.round((self.stepCount / Math.max(1, self.stepGoal)) * 100));
            stepBar.style.width = pct + '%';
          }
        }, 500);
      },

      _motionHandler: function(e) {
        if (!this.motionTracking) return;
        var acc = e.accelerationIncludingGravity;
        if (!acc) return;
        var x = acc.x || 0;
        var y = acc.y || 0;
        var z = acc.z || 0;
        var deltaX = Math.abs(x - this.lastAccel.x);
        var deltaY = Math.abs(y - this.lastAccel.y);
        var deltaZ = Math.abs(z - this.lastAccel.z);
        var totalDelta = deltaX + deltaY + deltaZ;
        if (totalDelta > this.motionThreshold) {
          this.stepCount++;
        }
        this.lastAccel = { x: x, y: y, z: z };
      },

      stopMotionTracking: function() {
        this.motionTracking = false;
        window.removeEventListener('devicemotion', this._motionHandler);
        if (this._stepInterval) clearInterval(this._stepInterval);
      },

      canLogWorkout: function() {
        if (!this.gymTimerRunning) return true;
        var minSteps = Math.max(50, Math.floor(this.gymTimerSeconds * 0.5));
        return this.stepCount >= minSteps;
      },

      finishWorkout: function() {
        var minSteps = Math.max(50, Math.floor(this.gymTimerSeconds * 0.5));
        if (this.stepCount < minSteps) {
          this.showToast('Need at least ' + minSteps + ' steps to verify workout. Keep moving!', 'error');
          return;
        }
        var pw = this._pendingWorkout;
        if (pw) {
          var duration = Math.round(this.gymTimerSeconds / 60);
          this.data.workouts.unshift({
            id: uid(),
            name: pw.dayName + ' (' + pw.exercises.join(', ') + ')',
            type: pw.type,
            duration: duration,
            calories: this.caloriesBurned,
            steps: this.stepCount,
            date: todayStr()
          });
          this.data.profile.totalWorkouts++;
          this.data.profile.xp += Math.round(duration * 2 + this.stepCount * 0.05);
          this.checkLevelUp();
          saveData(this.data);
          this._pendingWorkout = null;
        }
        this.stopGymTimer();
        this.showToast('Workout verified! ' + this.stepCount + ' steps, ' + this.caloriesBurned + ' kcal burned.', 'success');
        this.renderPage();
      },

      showToast: function(msg, type) {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;font-family:Sora,sans-serif;font-size:13px;font-weight:600;z-index:9999;max-width:90%;text-align:center;animation:fadeIn 0.3s ease;' +
          (type === 'error' ? 'background:rgba(255,100,100,0.95);color:#fff;' : 'background:rgba(78,222,163,0.95);color:#1a1d24;');
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 3000);
      },

      showExDetail: function(id) {
        var ex = EXERCISES[id];
        if (!ex) return;
        var mlvl = LEVELS[ex.level - 1] || LEVELS[0];
        var mcol = MUSCLE_CLR[ex.muscle] || '#afc6ff';
        document.getElementById('modal-root').innerHTML =
          '<div class="modal-overlay" onclick="App.closeModal()"><div class="modal-content" onclick="event.stopPropagation()" style="max-width:480px;">' +
            '<div style="display:flex;gap:16px;margin-bottom:20px;">' +
              '<div style="width:100px;height:130px;background:' + mcol + '10;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;">' + muscleSVG(ex.muscle) + '</div>' +

      makeChartPath: function(vals) {
        if (vals.length < 2) return '';
        var max = Math.max.apply(null, vals) + 10;
        var min = Math.min.apply(null, vals) - 10;
        var range = max - min || 1;
        var step = 1000 / (vals.length - 1);
        var pts = [];
        for (var i = 0; i < vals.length; i++) {
          pts.push({ x: i * step, y: 300 - ((vals[i] - min) / range) * 250 });
        }
        var d = 'M' + pts[0].x + ',' + pts[0].y;
        for (var j = 1; j < pts.length; j++) {
          d += ' C' + (pts[j-1].x + step*0.4) + ',' + pts[j-1].y + ' ' + (pts[j].x - step*0.4) + ',' + pts[j].y + ' ' + pts[j].x + ',' + pts[j].y;
        }
        return d;
      },

      toggleLibEx: function(el, id) {
        if (!this._selectedLibEx) this._selectedLibEx = [];
        var idx = this._selectedLibEx.indexOf(id);
        var check = el.querySelector('.lib-check');
        if (idx === -1) {
          this._selectedLibEx.push(id);
          el.style.borderColor = 'rgba(195,244,0,0.4)';
          el.style.background = 'rgba(195,244,0,0.08)';
          check.style.background = '#c3f400';
          check.style.borderColor = '#c3f400';
          check.innerHTML = '<span style="font-size:12px;color:#1a1d24;">&#10003;</span>';
        } else {
          this._selectedLibEx.splice(idx, 1);
          el.style.borderColor = 'rgba(255,255,255,0.06)';
          el.style.background = 'rgba(255,255,255,0.03)';
          check.style.background = 'transparent';
          check.style.borderColor = 'rgba(255,255,255,0.15)';
          check.innerHTML = '';

        this._updateLibSelected();
      },

      _updateLibSelected: function() {
        var count = this._selectedLibEx.length;
        var panel = document.getElementById('libSelected');
        var countEl = document.getElementById('libSelCount');
        var namesEl = document.getElementById('libSelNames');
        var nameInput = document.getElementById('wN');
        var typeInput = document.getElementById('wT');
        var durInput = document.getElementById('wD');
        var calInput = document.getElementById('wC');
        if (!panel) return;
        if (count === 0) {
          panel.style.display = 'none';
          if (nameInput) nameInput.value = '';
          return;
        }
        panel.style.display = 'block';
        if (countEl) countEl.textContent = count;
        var names = [];
        var totalRest = 0;
        var totalSets = 0;
        var hasCardio = false;
        for (var i = 0; i < this._selectedLibEx.length; i++) {
          var ex = EXERCISES[this._selectedLibEx[i]];
          names.push(ex.name);
          totalSets += (typeof ex.sets === 'number' ? ex.sets : parseInt(ex.sets) || 3);
          totalRest += ex.rest;
          if (ex.type === 'cardio' || ex.type === 'hiit') hasCardio = true;
        }
        if (namesEl) namesEl.textContent = names.join(', ');
        if (nameInput) nameInput.value = names.join(', ');
        if (typeInput) typeInput.value = hasCardio ? 'cardio' : 'strength';
        var estDur = Math.round(totalSets * 1.5 + totalRest * totalSets / 60 + count * 2);
        if (durInput && !durInput.value) durInput.value = estDur;
        if (calInput && !calInput.value) calInput.value = Math.round(estDur * 6);
      },

          App.data.measurements.unshift({
            id: uid(), weight: parseFloat(document.getElementById('bW').value) || null,
            bodyFat: parseFloat(document.getElementById('bBF').value) || null,
            muscleMass: parseFloat(document.getElementById('bMM').value) || null,
            waist: parseFloat(document.getElementById('bWa').value) || null,
            image: document.getElementById('bImg') ? document.getElementById('bImg').value : '',
            advice: document.getElementById('bAdvice') ? document.getElementById('bAdvice').value : '',
            date: todayStr()
          });
          App._bodyImageBlob = null;
          App.checkProgressRewards(App.data.measurements[0], prevMeasurement);
          App.checkLevelUp();
          saveData(App.data); App.closeModal(); App.renderPage();
        };
      },

      deleteWorkout: function(id) {
        this.data.workouts = this.data.workouts.filter(function(w) { return w.id !== id; });
        saveData(this.data); this.renderPage();
      },

      deleteMeal: function(id) {
        this.data.meals = this.data.meals.filter(function(m) { return m.id !== id; });
        saveData(this.data); this.renderPage();
      },

      addWater: function() {
        this.data.water = Math.round((this.data.water + 0.25) * 10) / 10;
        saveData(this.data); this.renderPage();
      },

      showAddSteps: function() {
        document.getElementById('modal-root').innerHTML =
          '<div class="modal-overlay" onclick="App.closeModal()"><div class="modal-content" onclick="event.stopPropagation()">' +
            '<h3 style="font-family:Sora,sans-serif;font-size:20px;margin-bottom:16px;">Log Steps</h3>' +
            '<div style="display:flex;flex-direction:column;gap:12px;">' +
              '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">' +
                '<button onclick="App.addSteps(500)" style="padding:12px;border-radius:8px;background:rgba(255,193,7,0.1);border:1px solid rgba(255,193,7,0.2);color:#ffc107;font-family:JetBrains Mono,monospace;font-size:14px;cursor:pointer;">+500</button>' +
                '<button onclick="App.addSteps(1000)" style="padding:12px;border-radius:8px;background:rgba(255,193,7,0.15);border:1px solid rgba(255,193,7,0.3);color:#ffc107;font-family:JetBrains Mono,monospace;font-size:14px;cursor:pointer;">+1,000</button>' +
                '<button onclick="App.addSteps(2000)" style="padding:12px;border-radius:8px;background:rgba(255,193,7,0.2);border:1px solid rgba(255,193,7,0.4);color:#ffc107;font-family:JetBrains Mono,monospace;font-size:14px;cursor:pointer;">+2,000</button>' +
              '</div>' +
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
                '<button onclick="App.addSteps(3000)" style="padding:12px;border-radius:8px;background:rgba(255,193,7,0.25);border:1px solid rgba(255,193,7,0.5);color:#ffc107;font-family:JetBrains Mono,monospace;font-size:14px;cursor:pointer;">+3,000</button>' +
                '<button onclick="App.addSteps(5000)" style="padding:12px;border-radius:8px;background:rgba(255,193,7,0.3);border:1px solid rgba(255,193,7,0.6);color:#ffc107;font-family:JetBrains Mono,monospace;font-size:14px;cursor:pointer;">+5,000</button>' +
              '</div>' +
              '<div style="position:relative;">' +
                '<input id="customSteps" type="number" placeholder="Custom steps" class="input-glass" style="padding-left:12px;">' +
              '</div>' +
              '<button onclick="App.addCustomSteps()" class="btn-glow" style="border-radius:12px;width:100%;padding:14px;color:#10131b;font-family:Sora,sans-serif;font-size:16px;font-weight:600;border:none;cursor:pointer;">Add Custom</button>' +
              '<div style="text-align:center;font-family:JetBrains Mono,monospace;font-size:13px;color:#c2c6d7;">Today: <span style="color:#ffc107;font-weight:600;">' + this.data.steps.toLocaleString() + '</span> steps</div>' +
            '</div>' +
          '</div></div>';
      },

      addSteps: function(amount) {
        this.data.steps += amount;
        this.checkLevelUp();
        saveData(this.data); this.closeModal(); this.renderPage();
      },

      addCustomSteps: function() {
        var val = parseInt(document.getElementById('customSteps').value) || 0;
        if (val > 0) {
          this.data.steps += val;
          this.checkLevelUp();
          saveData(this.data);
        }
        this.closeModal(); this.renderPage();
      },

      resetData: function() {
        this.data = getDefaultData();
        saveData(this.data); this.renderPage();
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      document.fonts.ready.then(function() { document.body.classList.add('icons-loaded'); });
      setTimeout(function() { document.body.classList.add('icons-loaded'); }, 3000);
      var hash = window.location.hash;
      if (hash.indexOf('access_token') !== -1) {
        var params = new URLSearchParams(hash.substring(1));
        var token = params.get('access_token');
        if (token) {
          fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
            headers: { 'Authorization': 'Bearer ' + token }
          }).then(function(r) { return r.json(); }).then(function(info) {
            var user = { id: info.sub, name: info.name, email: info.email, picture: info.picture };
            saveUser(user);
            var data = getData();
            data.profile.name = user.name.split(' ')[0];
            saveData(data);
            window.location.hash = '';
            App.init();
          }).catch(function() { App.init(); });
          return;
        }
      }
      loadGoogleScript();
      App.init();
    });
  </script>
</body>
</html>
